<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111c35">
    <title>Sin conexión · Control Horario</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
            color: #172033;
            background: #f3f6fb;
        }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
        }
        main {
            width: min(100%, 440px);
            padding: 32px;
            border: 1px solid #e3e9f2;
            border-radius: 20px;
            background: #fff;
            text-align: center;
        }
        h1 { margin-top: 0; }
        p { color: #64718a; line-height: 1.6; }
    </style>
</head>
<body>
    <main>
        <h1>Sin conexión</h1>
        <p>No podemos abrir el control horario ahora. Comprueba tu conexión e inténtalo de nuevo.</p>
        <p>Por seguridad, los datos de sesión y los fichajes no están disponibles sin conexión.</p>
    </main>
</body>
</html>
